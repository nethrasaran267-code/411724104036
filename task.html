<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="task1.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Heading -->
    <h1>Responsive Website Assignment</h1>

    <!-- Image -->
    <img
        src="dududu.jpg"
        alt="Sample Image"
        class="rounded-image"
    >

    <!-- Video -->
    <div class="video-container">
        <video controls>
            <source src="videoeg.mp4" type="video/mp4" alt="A video is playing">
        </video>
    </div>

    <!-- Table -->
    <table>
        <tr>
            <th>1</th>
            <td>Some Text</td>
            <td>Some Text</td>
        </tr>
        <tr>
            <th>2</th>
            <td>Some Text</td>
            <td>Some Text</td>
        </tr>
        <tr>
            <th>3</th>
            <td>Some Text</td>
            <td>Some Text</td>
        </tr>
    </table>

    <!-- Button -->
    <button id="myButton">Click Me</button>

    <!-- Grid -->
    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
